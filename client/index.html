<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="description"
    content="Explore developer stories, tutorials, and ideas from the Hashnode Clone community." />

  <title>Hashnode Clone — Developer Community</title>

  <style>
    .initial-loading {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #f7f7fb;
      color: #19172b;
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
    }

    .initial-loading__spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #e6e4ef;
      border-top-color: #7655e8;
      border-radius: 50%;
      animation: initial-spin 0.8s linear infinite;
    }

    .initial-loading p {
      margin: 0;
      font-size: 14px;
    }

    @keyframes initial-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .initial-loading__spinner {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <div id="root">
    <div class="initial-loading" role="status" aria-live="polite">
      <div class="initial-loading__spinner" aria-hidden="true"></div>

      <p>Loading Hashnode Clone...</p>
    </div>
  </div>

  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
